# ---------------------------------------------------------------
#  Stock Tracker configuration  (edit this file, no rebuild needed)
#  Any key can also be overridden by an environment variable:
#  db.password  ->  DB_PASSWORD      scheduler.times -> SCHEDULER_TIMES
# ---------------------------------------------------------------

# ---- MySQL ----
# The database is created automatically if it does not exist
db.url=jdbc:mysql://localhost:3306/stock_tracker?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&characterEncoding=utf8
db.user=root
db.password=

# ---- Automatic daily update ----
# Time zone used for the schedule below
scheduler.zone=Asia/Kolkata
# Times (HH:mm, 24h, in the zone above) when prices are fetched every day.
#   18:30 -> after the NSE/BSE close (15:30 IST)
#   07:30 -> after the US close (about 01:30-02:30 IST)
scheduler.times=18:30,07:30
# Also fetch missing days as soon as the program starts (catch-up if the PC was off)
scheduler.update.on.startup=true

# ---- Price API (Yahoo Finance chart endpoint, no API key needed) ----
# Parallel requests while updating thousands of companies
api.threads=6
# Pause (ms) after each request per thread, to stay friendly with the API
api.delay.ms=150

# ---- Charts ----
# Folder where PNG charts are saved
charts.dir=charts
